# Reusable guardrails gate — consumers call this as a whole job:
#
#   jobs:
#     guardrails:
#       uses: AgentVibes/guardrails/.github/workflows/guardrails-gate.yml@v0
#
# Chosen over a composite action because the gate is a complete job (checkout
# with full history, toolchain, install, two blocking commands), not a step to
# splice into someone else's job — one `uses:` line, nothing to forget.
# `@v0` is a moving tag (actions-style); pin `@<sha>` for stricter repos.
#
# Requirements in the consuming repo:
#   - @agentvibes/guardrails in devDependencies (git pin until npm publish)
#   - pnpm lockfile committed
#   - optional .guardrails/metrics.json baseline — without it the metrics
#     ratchet SKIPS LOUDLY (a ::notice:: annotation), never silently
#
# Every step is blocking. No `|| echo warning` — a non-blocking quality gate
# is the anti-pattern this package exists to kill.
name: guardrails-gate

on:
  workflow_call:
    inputs:
      base:
        description: "base ref for verify-diff (default: the merge-base ladder — origin/HEAD, origin/main, …)"
        required: false
        type: string
        default: ""
      leaks:
        description: "also run `guardrails leaks .` (recommended for public repos)"
        required: false
        type: boolean
        default: false
      guardrails_cmd:
        description: "how to invoke the CLI; the default resolves the installed dependency's bin. Override only for unusual layouts (this repo's selftest uses `node dist/cli.js` — pnpm does not link a package's own bin)"
        required: false
        type: string
        default: "pnpm exec guardrails"
      tool_versions:
        description: ".tool-versions content for the runner toolchain"
        required: false
        type: string
        default: |
          node 25.9.0
          pnpm 10.12.1
          ast-grep 0.45.2
          gitleaks 8.30.1
      sibling_repos:
        description: >-
          space-separated owner/repo list checked out at gits-layout positions
          before install, for workspaces that reach OUTSIDE their repo
          (link:../<repo>/... overrides, ../../<org>/<repo> workspace globs).
          When set, the MAIN checkout moves to repos/<org>/<repo> and every
          sibling lands at repos/<owner>/<name>, reproducing the
          ~/gits/github/<org>/<repo> layout — so both `../components`
          (same-org sibling) and `../../<other-org>/<repo>` resolve. Private
          siblings need the sibling_token secret (the default job token only
          reaches the current repo).
        required: false
        type: string
        default: ""
      runner_labels:
        description: >-
          JSON array of labels selecting the runner for the gate job. Defaults
          to a self-hosted Linux runner: hosted minutes are metered and a
          free-plan allowance can run out mid-month, which stops every job in
          the account from starting at all. Self-hosted minutes are not
          metered. Pass '["ubuntu-latest"]' to use hosted runners instead.
        required: false
        type: string
        default: '["self-hosted","linux","x64"]'
      npm_auth_registry:
        description: >-
          Registry path to authenticate the install against, in npmrc form and
          WITHOUT a scheme — e.g. "//registry.example.com/api/packages/acme/npm/".
          Supplied by the caller on purpose: this workflow lives in a public
          repository, so a registry host hardcoded here would be a house detail
          published with the package. Leave unset (the default) and no auth is
          configured, which is what every consumer with only public dependencies
          wants. Set it together with the npm_auth_token secret; setting one
          without the other fails the job rather than proceeding into a 401 that
          looks like a broken lockfile.
        required: false
        type: string
        default: ""
    secrets:
      npm_auth_token:
        description: "token for npm_auth_registry; required if and only if npm_auth_registry is set"
        required: false
      sibling_token:
        description: "token with read access to the sibling_repos; falls back to the job token (sufficient only for public siblings)"
        required: false

jobs:
  gate:
    runs-on: ${{ fromJSON(inputs.runner_labels) }}
    # See ci.yml: bounds execution, not queueing. Worth more here than there —
    # this job runs in SOMEONE ELSE'S repo, on whatever runner their labels
    # select, and a wedged gate holding a shared slot is their outage, not this
    # repo's.
    timeout-minutes: 45
    env:
      # With siblings, the main repo sits at gits-layout depth so relative
      # escapes resolve; without, it stays at the workspace root as always.
      MAIN_DIR: ${{ inputs.sibling_repos != '' && format('repos/{0}', github.repository) || '.' }}
    steps:
      # Full history: verify-diff gates ADDED lines vs merge-base; a shallow
      # checkout has no merge-base and would degrade the ratchet to whole-file.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: ${{ inputs.sibling_repos != '' && format('repos/{0}', github.repository) || '.' }}

      - uses: jdx/mise-action@v2
        with:
          tool_versions: ${{ inputs.tool_versions }}

      # Shallow clones at repos/<owner>/<name>: the gate only needs the trees
      # to exist for install to succeed. Plain git clone rather than
      # actions/checkout so one token covers N repos.
      - name: clone sibling repos (gits layout)
        if: ${{ inputs.sibling_repos != '' }}
        env:
          SIBLING_TOKEN: ${{ secrets.sibling_token || github.token }}
        run: |
          for repo in ${{ inputs.sibling_repos }}; do
            echo "cloning $repo -> repos/$repo"
            git clone --depth=1 "https://x-access-token:${SIBLING_TOKEN}@github.com/${repo}.git" "repos/${repo}"
          done

      # Private-scoped dependencies. Without this the install 401s and every
      # gate step after it is SKIPPED — which reads as "the gate ran and found
      # nothing", the failure this whole toolkit exists to prevent. Measured on
      # a consumer: merkle-substrate's gate had 54 runs with zero steps and one
      # run that reached here and died at ERR_PNPM_FETCH_401, so the gate had
      # never verified a line since adoption.
      #
      # $RUNNER_TEMP, never $HOME: on a self-hosted runner HOME is shared and
      # reused between jobs, so an npmrc written there outlives the job that
      # wrote it and leaks into the next one.
      #
      # $GITHUB_ENV rather than a job-level env: a job-level value would point
      # the toolchain setup at a file that does not exist yet.
      - name: configure private registry auth
        if: ${{ inputs.npm_auth_registry != '' }}
        env:
          NPM_AUTH_TOKEN: ${{ secrets.npm_auth_token }}
        run: |
          if [ -z "${NPM_AUTH_TOKEN}" ]; then
            echo "::error title=guardrails gate::npm_auth_registry is set but the npm_auth_token secret is empty. Refusing to install unauthenticated — a 401 here would skip every gate step and read as a clean run." >&2
            exit 1
          fi
          umask 077
          printf '%s:_authToken=%s\n' "${{ inputs.npm_auth_registry }}" "${NPM_AUTH_TOKEN}" > "$RUNNER_TEMP/.npmrc-guardrails-gate"
          echo "NPM_CONFIG_USERCONFIG=$RUNNER_TEMP/.npmrc-guardrails-gate" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile
        working-directory: ${{ env.MAIN_DIR }}

      - name: verify-diff (added-lines ratchet)
        run: ${{ inputs.guardrails_cmd }} verify-diff ${{ inputs.base != '' && format('--base {0}', inputs.base) || '' }}
        working-directory: ${{ env.MAIN_DIR }}

      - name: metrics ratchet (when baseline present)
        working-directory: ${{ env.MAIN_DIR }}
        run: |
          if [ -f .guardrails/metrics.json ]; then
            ${{ inputs.guardrails_cmd }} metrics --check
          else
            echo "::notice title=guardrails metrics::no baseline at .guardrails/metrics.json — metrics ratchet SKIPPED. Create one with 'guardrails metrics --update-baseline' and commit it."
          fi

      - name: leaks gate
        if: ${{ inputs.leaks }}
        run: ${{ inputs.guardrails_cmd }} leaks .
        working-directory: ${{ env.MAIN_DIR }}

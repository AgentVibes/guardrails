# CI gate — BLOCKING on purpose. No `|| echo warning`, no continue-on-error:
# a non-blocking quality step is the anti-pattern this package exists to kill.
# `pnpm check` = build (tsc) + biome lint + rule-fixture harness + the
# gate-can-go-red test (verify must exit 1 on a deliberately bad file).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Self-hosted Linux runner. Hosted minutes are metered and the free-plan
    # allowance runs out mid-month; when it does, jobs stop being dispatched
    # entirely (they end in seconds having run zero steps). Self-hosted minutes
    # are not metered. Swap to ubuntu-latest if no self-hosted runner is up.
    runs-on: [self-hosted, linux, x64]
    # Bounds a job that is RUNNING, not one that is queued: GitHub's default is
    # 6h, and these runners are shared with every other ci-runner unit on the
    # box, so one wedged install holds a slot for six hours. Measured today on
    # self-hosted: ci 5-10 min, gate-selftest 10-17 min, so 45 is generous.
    # It does NOT rescue the no-runner case — a job with no matching runner sits
    # QUEUED, and queued time is not counted against this.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Installs the exact toolchain mise.toml pins (node, pnpm, ast-grep,
      # biome) — CI runs what every host runs.
      - uses: jdx/mise-action@v2

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      # House-marker scan: the generic self-scan in `pnpm check` structurally
      # CANNOT see private-infrastructure names (the marker list is private by
      # design), which is exactly how a house domain slipped into a promoted
      # rule's comments unnoticed. This step fetches the private list at CI
      # time — never committed here — and fails the build on any hit. Secrets:
      # HOUSE_LEAKS_REPO (owner/repo holding leaks.txt) + HOUSE_LEAKS_TOKEN
      # (read access to it). Skips LOUDLY when unset (fork PRs).
      - name: house-marker leaks scan
        env:
          HOUSE_LEAKS_REPO: ${{ secrets.HOUSE_LEAKS_REPO }}
          HOUSE_LEAKS_TOKEN: ${{ secrets.HOUSE_LEAKS_TOKEN }}
        run: |
          if [ -z "$HOUSE_LEAKS_REPO" ] || [ -z "$HOUSE_LEAKS_TOKEN" ]; then
            echo "::notice title=house leaks::HOUSE_LEAKS_REPO/TOKEN secrets unset — house-marker scan SKIPPED (generic scan still ran)."
            exit 0
          fi
          # $RUNNER_TEMP, not /tmp: a self-hosted runner reuses the same
          # machine across jobs, so /tmp/house-leaks survives and the clone
          # fails with "destination path already exists". RUNNER_TEMP is
          # recreated per job on every runner type.
          dest="$RUNNER_TEMP/house-leaks"
          rm -rf "$dest"
          git clone --depth=1 "https://x-access-token:${HOUSE_LEAKS_TOKEN}@github.com/${HOUSE_LEAKS_REPO}.git" "$dest"
          node dist/cli.js leaks . --patterns "$dest/leaks.txt"

      - name: pack must succeed
        run: pnpm pack

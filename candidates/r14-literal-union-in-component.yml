id: r14-literal-union-in-component
language: typescript
severity: warning
message: |
  R14 — Literal-string union type defined inline in a component file or app
  layout.  Move enum-style state ("tasks" | "habits" | "stream",
  "idle" | "loading" | "ready" | "error", etc.) to:
    - a MobX store (UiStore for ephemeral UI state, ThemeStore for theme,
      etc.) where it lives next to the actions that mutate it, OR
    - apps/ppa/lib/<scope>/ as a typed constant + type alias when the union
      is purely lexical (file kinds, palette names) with no associated state.
  Component prop types should consume the SHARED type, not redefine it
  inline.  Inline definitions duplicate the union across every component
  that touches it and silently drift apart.
  See <vault>/_agent/Notes/2026-05-03-code-quality-rules.md R14.
files:
  - "apps/ppa/components/**/*.ts"
  - "apps/ppa/components/**/*.tsx"
  - "apps/ppa/app/**/*.ts"
  - "apps/ppa/app/**/*.tsx"
ignores:
  - "**/__tests__/**"
  - "**/_fixture.ts"
  - "**/_fixtures.ts"
rule:
  all:
    - pattern: 'export type $NAME = $TYPE'
    - regex: '"[^"]+"\s*\|\s*"[^"]+"'

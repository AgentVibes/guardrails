id: r7-raw-hsl-outside-tokens
language: tsx
severity: warning
message: |
  R7 — Raw hsl(...) string in a component. Use useTokens() and the
  semantic tokens defined in apps/<app>/lib/tokens.ts. If the token
  you need doesn't exist, ADD it to tokens.ts/themed-tokens.ts first.
  Origin: rule R7 of the 2026-05-03 code-quality audit.
  and AGENTS.md (HSL/tokens rule).
files:
  - "apps/<app>/components/**/*.tsx"
ignores:
  - "**/_fixture.ts"
  - "**/__tests__/**"
rule:
  kind: string
  regex: 'hsl\('

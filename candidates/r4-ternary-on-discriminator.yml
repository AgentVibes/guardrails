id: r4-ternary-on-discriminator
language: tsx
severity: warning
message: |
  R4 — Ternary on a discriminator field. Replace with
  match($OBJ).with({...}, ...).exhaustive() from ts-pattern.
  Applies to .kind / .status / .state / .type / .provider / .providerId / .reason / .mode.
  See <vault>/_agent/Notes/2026-05-03-code-quality-rules.md R4
  and the existing kind-if-without-match rule (defensive-errors).
rule:
  any:
    - pattern: "$O.kind === $L ? $A : $B"
    - pattern: "$O.status === $L ? $A : $B"
    - pattern: "$O.state === $L ? $A : $B"
    - pattern: "$O.type === $L ? $A : $B"
    - pattern: "$O.provider === $L ? $A : $B"
    - pattern: "$O.providerId === $L ? $A : $B"
    - pattern: "$O.reason === $L ? $A : $B"
    - pattern: "$O.mode === $L ? $A : $B"
